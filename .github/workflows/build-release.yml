name: Build Android Release

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-release.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify signing files are absent from checkout
        run: |
          if git ls-files | grep -E '(^|/)(local\.properties|.*\.(jks|keystore|p12|pfx|pem))$'; then
            echo "::error::Sensitive signing or local configuration files must not be tracked."
            exit 1
          fi
          test ! -e wallnice-release.jks
          test ! -e wallnice-release-signing.env
          test ! -e android/local.properties
          test ! -e android/app/release.keystore

      - name: Run security control assertions
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          build-root-directory: android
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Configure Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::All permanent release signing secrets are required."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Build Signed Release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --build-cache --parallel --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep "versionName" android/app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WallNice-release-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WallNice-bundle-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        if: success()
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WallNice v${{ steps.version.outputs.version }}
          body: |
            Release build v${{ steps.version.outputs.version }}.
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary signing file
        if: always()
        run: rm -f -- android/app/release.keystore
