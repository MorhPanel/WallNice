name: Auto Generate Catalog

on:
  push:
    paths:
      - 'DLS/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow

      - name: Generate catalog.json
        run: |
          python3 .github/scripts/generate_catalog.py

      - name: Validate media catalog
        run: python3 .github/scripts/validate_catalog.py

      - name: Commit and push updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate catalog from DLS/ directory" && git push)
